plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'org.nclaw.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'org.nclaw.mobile'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        python {
            version '3.11'
            pip {
                install 'httpx>=0.27,<1.0'
            }
        }
    }
}
