# Runs only when the repository contains Swift source or package files.
name: Swift

on:
  push:
    branches: ["main"]
    paths:
      - "Package.swift"
      - "**/Package.swift"
      - "**/*.swift"
  pull_request:
    branches: ["main"]
    paths:
      - "Package.swift"
      - "**/Package.swift"
      - "**/*.swift"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v
