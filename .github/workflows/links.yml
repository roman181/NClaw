name: Links
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude '^http://127[.]0[.]0[.]1:11434/?$'
            --exclude '^http://192[.]168[.]1[.]50:11434/?$'
            --exclude '^https://theresanaiforthat[.]com/?$'
            --exclude '^https://www[.]onlinegdb[.]com/?$'
            README.md SECURITY.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
