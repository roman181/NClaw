name: Links
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude '127[.]0[.]0[.]1:11434'
            --exclude '192[.]168[.]1[.]50:11434'
            --exclude 'theresanaiforthat[.]com'
            --exclude 'onlinegdb[.]com'
            --exclude 'deeprepo[.]dev'
            README.md SECURITY.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
